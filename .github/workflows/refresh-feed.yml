name: Refresh Nephrology Feed

on:
  schedule:
    # Once daily. Nephrology publishing volume doesn't need tighter polling,
    # and seenIds-based dedupe in refresh-feed.ts keeps each run cheap.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Extractive summarizer only — no ANTHROPIC_API_KEY needed. NCBI_EMAIL
      # and NCBI_API_KEY are optional (repo variable / secret); unset is
      # fine, just a lower NCBI rate-limit ceiling.
      - run: npm run refresh-feed
        env:
          NCBI_TOOL: swipe-reader-nephrology
          NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}

      - name: Commit updated feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/fixtures/feed.json
          if git diff --cached --quiet; then
            echo "No new studies — nothing to commit."
          else
            git commit -m "Refresh nephrology feed from PubMed"
            git push
          fi
